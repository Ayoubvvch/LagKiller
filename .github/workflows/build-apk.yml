name: Build LagKiller Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build LagKiller APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/LagKiller-v1.2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LagKiller-v1.2.0-APK
          path: release-output/LagKiller-v1.2.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.0
          name: "LagKiller Root v1.2.0 - Frame-0 Instant Cache Edition"
          body: |
            ### ⚡ LagKiller Root v1.2.0: Frame-0 Instant Cache Edition

            - **Intelligent Dual-Layer Caching Architecture:**
              - Frame-0 instant hydration from local persistent storage (0ms startup latency).
              - Never re-scans installed packages from scratch on open; apps are interactive immediately on frame 1.
              - Disk-backed icon caching (PNGs cached locally on flash storage, avoiding repetitive APK resource decoding).
              - Stale-While-Revalidate background silent scanning without layout shifting or screen flickering.
              - 0ms optimistic UI action responses for Force Stop, Suspend, and Freeze.
          files: release-output/LagKiller-v1.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
