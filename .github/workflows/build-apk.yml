name: Build LagKiller Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build LagKiller APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/LagKiller-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LagKiller-v1.1.0-APK
          path: release-output/LagKiller-v1.1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.1.0
          name: "LagKiller Root v1.1.0 - Ultra Fast & Smooth Edition"
          body: |
            ### ⚡ LagKiller Root v1.1.0: Ultra-Fast & Smooth Edition

            - **Performance & Smoothness Optimization:**
              - Removed background auto-refresh loops completely (zero background battery/CPU consumption).
              - Added dedicated manual Refresh button (تحديث الفحص).
              - Instant 0ms optimistic UI action response on Force Stop, Suspend, and Freeze.
              - In-memory application metadata caching for instantaneous search and filtering.
              - Asynchronous background root process scanning on IO threads.
              - One-Tap Quick Boost to force-stop background resource hogs and drop caches.
          files: release-output/LagKiller-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
