<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LagKiller Root | كاشف ومزيل البطء الذكي</title>
  <style>
    :root {
      --bg: #050811;
      --surface: #0a1122;
      --surface-card: #0f1a35;
      --surface-hover: #16254a;
      --border: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.14);
      --cyan: #00F0FF;
      --cyan-glow: rgba(0, 240, 255, 0.25);
      --red: #FF3366;
      --red-glow: rgba(255, 51, 102, 0.35);
      --emerald: #00FF9D;
      --emerald-glow: rgba(0, 255, 157, 0.25);
      --amber: #FFAA00;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Cairo", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

    /* Header */
    header {
      background: rgba(10, 17, 34, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #00F0FF, #0066FF);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--cyan-glow);
      color: #000;
      font-weight: 900;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #FFF 30%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .root-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 20px;
      background: rgba(0, 255, 157, 0.12);
      color: var(--emerald);
      border: 1px solid rgba(0, 255, 157, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Manual Refresh Button */
    .btn-refresh {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-refresh:active { transform: scale(0.96); background: rgba(0, 240, 255, 0.25); }
    .btn-refresh.loading { opacity: 0.7; pointer-events: none; }

    /* Main Scroll Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    /* Metrics Overview Card */
    .metrics-card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .metrics-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .metric-box {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .metric-value {
      font-size: 17px;
      font-weight: 800;
      color: var(--cyan);
      font-family: monospace;
    }

    .metric-bar-bg {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }
    .metric-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    /* Quick Boost Button */
    .btn-quick-boost {
      background: linear-gradient(135deg, #FF3366 0%, #FF0055 100%);
      color: #FFF;
      border: none;
      border-radius: var(--radius);
      padding: 12px 18px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px var(--red-glow);
      transition: all 0.2s ease;
      width: 100%;
    }
    .btn-quick-boost:active { transform: scale(0.98); filter: brightness(1.2); }

    /* Tabs Bar */
    .tabs-wrapper {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      flex-shrink: 0;
    }
    .tab-btn {
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    /* Search Box */
    .search-box {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #FFF;
      font-size: 13px;
      width: 100%;
    }
    .search-box input::placeholder { color: var(--text-dim); }

    /* App Cards List */
    .apps-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 40px;
    }

    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: opacity 0.2s ease, border-color 0.2s ease;
    }
    .app-card.lag-maker {
      border-color: rgba(255, 51, 102, 0.45);
      background: linear-gradient(180deg, rgba(255, 51, 102, 0.07) 0%, var(--surface) 100%);
    }
    .app-card.frozen {
      opacity: 0.6;
      border-style: dashed;
    }
    .app-card.stopped {
      opacity: 0.65;
      border-color: rgba(255, 255, 255, 0.05);
    }

    .app-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--surface-card);
      flex-shrink: 0;
    }

    .app-info {
      flex: 1;
      min-width: 0;
    }
    .app-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }
    .app-name {
      font-size: 13.5px;
      font-weight: 700;
      color: #FFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-pkg {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: monospace;
    }

    .app-badges {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      font-family: monospace;
    }
    .badge-cpu-danger { background: rgba(255, 51, 102, 0.2); color: var(--red); border: 1px solid var(--red); }
    .badge-cpu-warn { background: rgba(255, 170, 0, 0.2); color: var(--amber); }
    .badge-cpu-normal { background: rgba(0, 240, 255, 0.1); color: var(--cyan); }
    .badge-ram { background: rgba(255, 255, 255, 0.06); color: var(--text-muted); }

    .tag-status {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .tag-running { background: rgba(0, 255, 157, 0.15); color: var(--emerald); }
    .tag-frozen { background: rgba(0, 240, 255, 0.15); color: var(--cyan); }
    .tag-suspended { background: rgba(255, 170, 0, 0.15); color: var(--amber); }
    .tag-protected { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }

    /* Action Buttons Row */
    .app-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .btn-action {
      flex: 1;
      padding: 7px 4px;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }
    .btn-action:active { transform: scale(0.96); }

    .btn-stop { background: rgba(255, 51, 102, 0.15); color: #FF6688; border-color: rgba(255, 51, 102, 0.3); }
    .btn-stop.done { background: rgba(0, 255, 157, 0.1); color: var(--emerald); border-color: transparent; pointer-events: none; }
    .btn-suspend { background: rgba(255, 170, 0, 0.15); color: var(--amber); border-color: rgba(255, 170, 0, 0.3); }
    .btn-resume { background: rgba(0, 255, 157, 0.15); color: var(--emerald); border-color: rgba(0, 255, 157, 0.3); }
    .btn-freeze { background: rgba(0, 240, 255, 0.12); color: var(--cyan); border-color: rgba(0, 240, 255, 0.3); }
    .btn-unfreeze { background: rgba(0, 255, 157, 0.15); color: var(--emerald); border-color: rgba(0, 255, 157, 0.3); }

    /* Toast Notification */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      z-index: 100;
    }
    .toast {
      background: rgba(15, 26, 53, 0.95);
      border: 1px solid var(--cyan);
      color: #FFF;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      animation: slideToast 0.25s ease;
      text-align: center;
    }
    @keyframes slideToast {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div>
        <div class="brand-title">LagKiller Root</div>
        <div style="display:flex; gap:6px; margin-top:2px;">
          <span class="root-badge" id="rootBadge">⚡ ROOT نشط</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <!-- Manual Refresh Button (NO auto-polling) -->
      <button class="btn-refresh" id="refreshBtn">
        <span id="refreshIcon">🔄</span> <span>تحديث الفحص</span>
      </button>
    </div>
  </header>

  <!-- Main Scrollable Area -->
  <main>

    <!-- Metrics Overview Card -->
    <div class="metrics-card">
      <div class="metrics-row">
        <!-- CPU Box -->
        <div class="metric-box">
          <div class="metric-label">
            <span>استهلاك المعالج</span>
            <span id="cpuSubtext">sys: 0%</span>
          </div>
          <div class="metric-value" id="cpuVal">0.0%</div>
          <div class="metric-bar-bg">
            <div class="metric-bar-fill" id="cpuBar" style="width: 0%; background: var(--cyan);"></div>
          </div>
        </div>

        <!-- RAM Box -->
        <div class="metric-box">
          <div class="metric-label">
            <span>الذاكرة (RAM)</span>
            <span id="ramFreeVal">متاح 0 MB</span>
          </div>
          <div class="metric-value" id="ramVal">0%</div>
          <div class="metric-bar-bg">
            <div class="metric-bar-fill" id="ramBar" style="width: 0%; background: var(--emerald);"></div>
          </div>
        </div>
      </div>

      <!-- Quick Boost Button -->
      <button class="btn-quick-boost" id="quickBoostBtn">
        <span>⚡ تسريع فوري للجهاز</span>
        <span style="font-size: 11px; opacity: 0.85;">(إيقاف كل المستهلكين وتفريغ كاش النواة)</span>
      </button>
    </div>

    <!-- Filter Tabs -->
    <div class="tabs-wrapper">
      <button class="tab-btn active" data-tab="lag">🔥 مسببات البطء (<span id="countLag">0</span>)</button>
      <button class="tab-btn" data-tab="running">🏃 بالخلفية (<span id="countRunning">0</span>)</button>
      <button class="tab-btn" data-tab="frozen">❄️ المجمدة (<span id="countFrozen">0</span>)</button>
      <button class="tab-btn" data-tab="all">📋 الكل (<span id="countAll">0</span>)</button>
      <button class="tab-btn" data-tab="system">🛡️ النظام (<span id="countSystem">0</span>)</button>
    </div>

    <!-- Search Input -->
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="بحث فوري عن أي تطبيق..." autocomplete="off">
    </div>

    <!-- Apps List Container -->
    <div class="apps-list" id="appsList">
      <div style="text-align: center; color: var(--text-dim); padding: 40px;">
        جاري الفحص المباشر... ⏳
      </div>
    </div>

  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    let allApps = [];
    let currentTab = 'lag';
    let searchQuery = '';
    let isScanning = false;

    // Toast Helper
    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 2500);
    }

    // Trigger Manual Scan
    function triggerScan() {
      if (isScanning) return;
      isScanning = true;
      const btn = document.getElementById('refreshBtn');
      const icon = document.getElementById('refreshIcon');
      btn.classList.add('loading');
      icon.textContent = '⏳';

      if (window.LagKillerBridge && window.LagKillerBridge.requestScanAsync) {
        window.LagKillerBridge.requestScanAsync();
      } else if (window.LagKillerBridge) {
        try {
          const raw = window.LagKillerBridge.getSystemStats();
          window.onSystemStatsReceived(JSON.parse(raw));
        } catch (e) {
          isScanning = false;
          btn.classList.remove('loading');
          icon.textContent = '🔄';
        }
      } else {
        isScanning = false;
        btn.classList.remove('loading');
        icon.textContent = '🔄';
        showToast('جهازك يعمل في وضع المعاينة');
      }
    }

    // Async Callback from Android
    window.onSystemStatsReceived = function(data) {
      isScanning = false;
      const btn = document.getElementById('refreshBtn');
      const icon = document.getElementById('refreshIcon');
      btn.classList.remove('loading');
      icon.textContent = '🔄';

      if (!data) return;

      // Update CPU UI
      const cpuTotal = data.cpu.total;
      document.getElementById('cpuVal').textContent = `${cpuTotal}%`;
      document.getElementById('cpuSubtext').textContent = `sys: ${data.cpu.sys}%`;
      const cpuBar = document.getElementById('cpuBar');
      cpuBar.style.width = `${Math.min(100, cpuTotal)}%`;
      cpuBar.style.background = cpuTotal > 40 ? 'var(--red)' : (cpuTotal > 15 ? 'var(--amber)' : 'var(--cyan)');

      // Update RAM UI
      const ramUsed = data.ram.usedMB;
      const ramTotal = data.ram.totalMB;
      const ramPercent = data.ram.percent;
      document.getElementById('ramVal').textContent = `${ramPercent}% (${(ramUsed/1024).toFixed(1)} GB)`;
      document.getElementById('ramFreeVal').textContent = `متاح ${data.ram.freeMB} MB`;
      const ramBar = document.getElementById('ramBar');
      ramBar.style.width = `${ramPercent}%`;
      ramBar.style.background = ramPercent > 85 ? 'var(--red)' : (ramPercent > 70 ? 'var(--amber)' : 'var(--emerald)');

      // Update Apps Data
      allApps = data.apps || [];
      updateCounts();
      renderApps();
    };

    function updateCounts() {
      const lagCount = allApps.filter(a => a.isLagMaker).length;
      const runningCount = allApps.filter(a => a.isRunning).length;
      const frozenCount = allApps.filter(a => a.isDisabled || a.isSuspended).length;
      const systemCount = allApps.filter(a => a.isSystem).length;

      document.getElementById('countLag').textContent = lagCount;
      document.getElementById('countRunning').textContent = runningCount;
      document.getElementById('countFrozen').textContent = frozenCount;
      document.getElementById('countSystem').textContent = systemCount;
      document.getElementById('countAll').textContent = allApps.length;
    }

    function filterApps() {
      return allApps.filter(app => {
        // Tab Filter
        let matchesTab = false;
        if (currentTab === 'lag') matchesTab = app.isLagMaker;
        else if (currentTab === 'running') matchesTab = app.isRunning;
        else if (currentTab === 'frozen') matchesTab = app.isDisabled || app.isSuspended;
        else if (currentTab === 'system') matchesTab = app.isSystem;
        else if (currentTab === 'all') matchesTab = true;

        if (!matchesTab) return false;

        // Instant In-memory Search Filter
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          return app.name.toLowerCase().includes(q) || app.pkg.toLowerCase().includes(q);
        }
        return true;
      }).sort((a, b) => {
        if (b.cpu !== a.cpu) return b.cpu - a.cpu;
        return b.ram - a.ram;
      });
    }

    function renderApps() {
      const listEl = document.getElementById('appsList');
      const filtered = filterApps();

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div style="text-align: center; color: var(--text-dim); padding: 40px; font-size: 13px;">
            ${currentTab === 'lag' ? '✨ رائع! لا توجد تطبيقات تستهلك المعالج بشكل مفرط حالياً' : 'لا توجد نتائج مطابقة'}
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map(app => {
        const isLag = app.isLagMaker;
        const isSuspended = app.isSuspended;
        const isDisabled = app.isDisabled;
        const isProtected = app.isProtected;

        let cpuBadgeClass = 'badge-cpu-normal';
        if (app.cpu >= 15) cpuBadgeClass = 'badge-cpu-danger';
        else if (app.cpu >= 5) cpuBadgeClass = 'badge-cpu-warn';

        return `
          <div class="app-card ${isLag ? 'lag-maker' : ''} ${isDisabled || isSuspended ? 'frozen' : ''}" id="card_${escapeId(app.pkg)}">
            <div class="app-card-header">
              <img class="app-icon" src="https://appassets.androidplatform.net/app-icon/${app.pkg}.png" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'40\\' height=\\'40\\'><rect width=\\'40\\' height=\\'40\\' rx=\\'8\\' fill=\\'%231A243D\\'/></svg>'" alt="" loading="lazy">
              <div class="app-info">
                <div class="app-title-row">
                  <span class="app-name">${escapeHtml(app.name)}</span>
                  ${isProtected ? '<span class="tag-status tag-protected">محمي 🛡️</span>' : ''}
                  <span class="tag-status tag-running" id="tag_run_${escapeId(app.pkg)}" style="display: ${app.isRunning ? 'inline-block' : 'none'};">يعمل</span>
                  <span class="tag-status tag-suspended" id="tag_susp_${escapeId(app.pkg)}" style="display: ${isSuspended ? 'inline-block' : 'none'};">معلق ⏸️</span>
                  <span class="tag-status tag-frozen" id="tag_froz_${escapeId(app.pkg)}" style="display: ${isDisabled ? 'inline-block' : 'none'};">مجمد ❄️</span>
                </div>
                <div class="app-pkg">${app.pkg}</div>
              </div>
              <div class="app-badges">
                <span class="badge ${cpuBadgeClass}" id="badge_cpu_${escapeId(app.pkg)}" style="display: ${app.cpu > 0 ? 'inline-block' : 'none'};">${app.cpu}% CPU</span>
                ${app.ram > 0 ? `<span class="badge badge-ram" id="badge_ram_${escapeId(app.pkg)}">${app.ram} MB</span>` : ''}
              </div>
            </div>

            <div class="app-actions">
              <!-- Force Stop Button (Instant Optimistic UI) -->
              <button class="btn-action btn-stop" id="btn_stop_${escapeId(app.pkg)}" onclick="handleAction('stop', '${app.pkg}', '${escapeHtml(app.name)}', ${isProtected})">
                ⚡ إيقاف
              </button>

              <!-- Suspend / Resume Button -->
              <button class="btn-action ${isSuspended ? 'btn-resume' : 'btn-suspend'}" id="btn_susp_${escapeId(app.pkg)}" onclick="handleAction('${isSuspended ? 'unsuspend' : 'suspend'}', '${app.pkg}', '${escapeHtml(app.name)}', ${isProtected})">
                ${isSuspended ? '▶️ استئناف' : '⏸️ تعليق'}
              </button>

              <!-- Freeze / Unfreeze Button -->
              <button class="btn-action ${isDisabled ? 'btn-unfreeze' : 'btn-freeze'}" id="btn_froz_${escapeId(app.pkg)}" onclick="handleAction('${isDisabled ? 'unfreeze' : 'freeze'}', '${app.pkg}', '${escapeHtml(app.name)}', ${isProtected})">
                ${isDisabled ? '🔥 إلغاء التجميد' : '❄️ تجميد'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    function escapeId(pkg) {
      return (pkg || '').replace(/[^a-zA-Z0-9_]/g, '_');
    }

    // Instant Optimistic Action Handling (0ms UI latency!)
    window.handleAction = function(type, pkg, name, isProtected) {
      if (isProtected) {
        alert(`تحذير: "${name}" هو تطبيق نظام أساسي محمي. لا ينصح بإيقافه!`);
        return;
      }

      if (!window.LagKillerBridge) return;

      const cardId = escapeId(pkg);
      const cardEl = document.getElementById(`card_${cardId}`);
      const btnStop = document.getElementById(`btn_stop_${cardId}`);
      const btnSusp = document.getElementById(`btn_susp_${cardId}`);
      const btnFroz = document.getElementById(`btn_froz_${cardId}`);
      const tagRun = document.getElementById(`tag_run_${cardId}`);
      const tagSusp = document.getElementById(`tag_susp_${cardId}`);
      const tagFroz = document.getElementById(`tag_froz_${cardId}`);
      const badgeCpu = document.getElementById(`badge_cpu_${cardId}`);

      // 1. Optimistic Immediate UI Feedback in 0ms:
      if (type === 'stop') {
        window.LagKillerBridge.forceStop(pkg);
        if (btnStop) {
          btnStop.innerHTML = '✓ متوقف';
          btnStop.classList.add('done');
        }
        if (tagRun) tagRun.style.display = 'none';
        if (badgeCpu) badgeCpu.style.display = 'none';
        if (cardEl) cardEl.classList.add('stopped');
        showToast(`تم إيقاف ${name} فورا ⚡`);
      } else if (type === 'suspend') {
        window.LagKillerBridge.suspendApp(pkg);
        if (btnSusp) {
          btnSusp.className = 'btn-action btn-resume';
          btnSusp.innerHTML = '▶️ استئناف';
          btnSusp.setAttribute('onclick', `handleAction('unsuspend', '${pkg}', '${escapeHtml(name)}', false)`);
        }
        if (tagSusp) tagSusp.style.display = 'inline-block';
        if (tagRun) tagRun.style.display = 'none';
        if (badgeCpu) badgeCpu.style.display = 'none';
        if (cardEl) cardEl.classList.add('frozen');
        showToast(`تم تعليق ${name} (Suspend) ⏸️`);
      } else if (type === 'unsuspend') {
        window.LagKillerBridge.unsuspendApp(pkg);
        if (btnSusp) {
          btnSusp.className = 'btn-action btn-suspend';
          btnSusp.innerHTML = '⏸️ تعليق';
          btnSusp.setAttribute('onclick', `handleAction('suspend', '${pkg}', '${escapeHtml(name)}', false)`);
        }
        if (tagSusp) tagSusp.style.display = 'none';
        if (cardEl) cardEl.classList.remove('frozen');
        showToast(`تم استئناف ${name} ▶️`);
      } else if (type === 'freeze') {
        window.LagKillerBridge.freezeApp(pkg);
        if (btnFroz) {
          btnFroz.className = 'btn-action btn-unfreeze';
          btnFroz.innerHTML = '🔥 إلغاء التجميد';
          btnFroz.setAttribute('onclick', `handleAction('unfreeze', '${pkg}', '${escapeHtml(name)}', false)`);
        }
        if (tagFroz) tagFroz.style.display = 'inline-block';
        if (tagRun) tagRun.style.display = 'none';
        if (badgeCpu) badgeCpu.style.display = 'none';
        if (cardEl) cardEl.classList.add('frozen');
        showToast(`تم تجميد ${name} (Disable) ❄️`);
      } else if (type === 'unfreeze') {
        window.LagKillerBridge.unfreezeApp(pkg);
        if (btnFroz) {
          btnFroz.className = 'btn-action btn-freeze';
          btnFroz.innerHTML = '❄️ تجميد';
          btnFroz.setAttribute('onclick', `handleAction('freeze', '${pkg}', '${escapeHtml(name)}', false)`);
        }
        if (tagFroz) tagFroz.style.display = 'none';
        if (cardEl) cardEl.classList.remove('frozen');
        showToast(`تم فك تجميد ${name} 🔥`);
      }

      // Update in-memory state
      const appRef = allApps.find(a => a.pkg === pkg);
      if (appRef) {
        if (type === 'stop') { appRef.isRunning = false; appRef.cpu = 0; }
        else if (type === 'suspend') { appRef.isSuspended = true; appRef.isRunning = false; }
        else if (type === 'unsuspend') { appRef.isSuspended = false; }
        else if (type === 'freeze') { appRef.isDisabled = true; appRef.isRunning = false; }
        else if (type === 'unfreeze') { appRef.isDisabled = false; }
        updateCounts();
      }
    };

    // Quick Boost Button
    document.getElementById('quickBoostBtn').addEventListener('click', () => {
      if (!window.LagKillerBridge) return;
      showToast('جاري تسريع الهاتف وتنظيف الذاكرة... ⚡');
      setTimeout(() => {
        const res = window.LagKillerBridge.quickBoost();
        const parsed = JSON.parse(res);
        showToast(parsed.message || 'تم تنظيف الخلفية بنجاح ⚡');
        triggerScan();
      }, 100);
    });

    // Tab buttons
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.getAttribute('data-tab');
        renderApps();
      });
    });

    // Instant Search Input
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderApps();
    });

    // Manual Refresh Button Listener
    document.getElementById('refreshBtn').addEventListener('click', triggerScan);

    // Initial Load ONCE (No interval timers!)
    window.addEventListener('load', () => {
      triggerScan();
    });
  </script>
</body>
</html>
